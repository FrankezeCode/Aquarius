# CRE workflow settings — Kamino / Solana risk (mirrors workflows/aave-risk layout).
# Aquarius API ingestion: POST /api/internal/ingest/cre-webhook with workflowId kamino-risk*.

staging-settings:
  user-workflow:
    workflow-name: "kamino-risk-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: ""

production-settings:
  user-workflow:
    workflow-name: "kamino-risk-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: ""
